[project]
name = "preditor-promos-milhas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "lightgbm>=4.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
